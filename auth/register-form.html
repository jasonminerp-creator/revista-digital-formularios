<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Revista Digital</title>
    <link rel="stylesheet" href="../css/form-style.css">
</head>

<body>
    <main class="auth-wrapper">
        <form class="auth-card" action="#" method="post" autocomplete="on">
            <h2>Formulario de Registro</h2>
            <p class="form-subtitle">Crea tu cuenta para participar en la revista.</p>

            <label for="register-name">Nombre de usuario</label>
            <input id="register-name" type="text" name="name" placeholder="Ingresa tu nombre" minlength="3" required>

            <label for="register-email">Correo electronico</label>
            <input id="register-email" type="email" name="email" placeholder="usuario@email.com" required>

            <label for="register-password">Contrasena</label>
            <input id="register-password" type="password" name="password" placeholder="Minimo 8 caracteres" minlength="8" required>

            <label for="register-confirm">Confirmar contrasena</label>
            <input id="register-confirm" type="password" name="confirm_password" placeholder="Repite tu contrasena" minlength="8" required>

            <button type="submit">Registrar cuenta</button>

            <a href="../auth/login-form.html">Ya tengo cuenta de usuario</a>
            <a href="../index.html">Retornar al inicio</a>
        </form>
    </main>
</body>

</html>
