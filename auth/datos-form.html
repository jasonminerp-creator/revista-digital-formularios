<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de Datos</title>

    <link rel="stylesheet" href="../css/datos-form.css">
</head>

<body>

    <main class="form-container">

        <form action="#" method="post">

            <section class="form-section">

                <h2>DATOS PERSONALES</h2>

                <div class="form-row">
                    <label for="documento">
                        Documento de Identificación
                    </label>

                    <input
                        type="text"
                        id="documento"
                        name="documento"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="nombre">Nombre</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="direccion">Dirección</label>

                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="pais">País</label>

                    <input
                        type="text"
                        id="pais"
                        name="pais"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="email">E-Mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

            </section>


            <section class="form-section">

                <h2>DATOS LABORALES</h2>

                <div class="form-row">
                    <label for="empresa">Empresa</label>

                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="sueldo">Sueldo ordinario</label>

                    <input
                        type="number"
                        id="sueldo"
                        name="sueldo"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="bonificacion">Bonificación</label>

                    <input
                        type="number"
                        id="bonificacion"
                        name="bonificacion"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

            </section>

            <div class="button-container">
                <button type="submit">
                    Enviar Datos
                </button>
            </div>

            <a class="home-link" href="../index.html">
                Retornar al inicio
            </a>

        </form>

    </main>

</body>

</html>
