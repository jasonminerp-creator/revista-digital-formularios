<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Revista Digital</title>
    <link rel="stylesheet" href="../css/form-style.css">
</head>

<body>
    <main class="auth-wrapper">
        <form class="auth-card" action="#" method="post" autocomplete="on">
            <h2>Acceso de Seguridad</h2>
            <p class="form-subtitle">Ingresa a tu cuenta para continuar.</p>

            <label for="login-email">Correo electronico</label>
            <input id="login-email" type="email" name="email" placeholder="usuario@email.com" required>

            <label for="login-password">Contrasena</label>
            <input id="login-password" type="password" name="password" placeholder="Ingresa tu contrasena" minlength="8" required>

            <button type="submit">Iniciar sesion</button>

            <a href="../auth/register-form.html">No tengo cuenta de usuario</a>
            <a href="../index.html">Retornar al inicio</a>
        </form>
    </main>
</body>

</html>
